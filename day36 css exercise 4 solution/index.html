<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css exercise 4 solution</title>
    <!-- we can use more then one style tag  -->
    <style>
@import url('https://fonts.googleapis.com/css2?family=Libertinus+Serif:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
</style>


    <style>
        :root{
            --primary-color:#fff2cb80;
            --text-color:rgb(51, 30, 30);
            --secondary-color:#d1b7f1;
        }

         /* :root{
            --primary-color:#aeeb8d80;
            --text-color:rgb(51, 30, 30);
            --secondary-color:#d1b7f1;
        } */

         /* :root{
            --primary-color:#eb251a80;
            --text-color:rgb(51, 30, 30);
            --secondary-color:#e7a7ed;
        } */
        body{
            background-color:var(--secondary-color);
        }

        *{
            padding: 0;
            margin: 0;
            font-family:Arial, Helvetica, sans-serif;
        }
        nav{
            background-color: var(--primary-color);
            padding: 12px 0px;
        }
        ul li{
            list-style: none;
            display: inline ;
            padding: 23px;
            font-weight:bolder;
            color:var(--text-color)
            
        }

        ul li a{
            color:var(--text-color);  
            text-decoration: none;
        }

    </style>
</head>
<body>
    <!-- create a multicolor website which changes color based on css variable. -->
     <header>
        <nav>
            <ul>
                <li><a href="/">home</a></li>
                <li><a href="/">about</a></li>
                <li><a href="/">services</a></li>
                <li><a href="/">contact us</a></li>
                
            </ul>
        </nav>
     </header>
</body>
</html>
