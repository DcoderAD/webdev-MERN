<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>css position property</title>
    <style>
      /* by default the position is static.and if it is set to static mean you can not apply top,bottom,left,right,z-index. */

      /* will also learn about fixed and sticky position */

      /* by default position is static.in media quary we set position to static some time and also we can set it static using java script which we will learn in future */

      /* there are 3 main positions static,elative,absolute */

      /* if the parent is positioned no matter what absolute,fixed,sticky if parent is positioned in any way cild position will follows it. 
      
      EXCEPTION::==>>

      there is only one exception and if you dint know it can introduce bug in your code which are transform,filter,perspective. */

      /* there are three properties which also can make an element appear as it is positioned which are transform,filter ,perspective */

      /* means if these three transform,filter ,perspective properties are in parent then also child will follow it  */


      /* z-index====>
       jiski value kam hogi wo niche aayega and jiski jitni jyada wo utna uper aayega .if you want a cascade effect templet then z index can be like 0,1,2,3,4 so on */
      * {
        margin: 0;
        padding: 0;
      }

      .box {
        border: 2px solid black;
        height: 433px;
        width: 80vw;
        margin: 3px;
        padding: 3px;
      }

      .box1 {
        background-color: aqua;
        /* position: absolute; */
        position: sticky;
        top: 0px;
        left: 2px;
        margin: 0;
        padding: 0;
            height: 111px;
            width: 100% ;
      }
      .box2 {
        background-color: bisque;
        /* position: relative; */
        /* top-bottom me se koi ek and left-right me se koi ek set krni hogi dono nahi */
        top: 34px;
        left: 56px;
      }
      .box3 {
        background-color: aquamarine;
        /* position: fixed;fixed will fix the box3 even whem scrolling */
        /* bottom: 0px;
        left: 8vw;
        height: 111px; */
      }
      .box4 {
        background-color: rgb(239, 248, 114);
      }

      

      .parent{
        padding: 43px;
        margin: 34px;
        border: 2px solid black;
        /* position: absolute */
        /* transform: translate(0); */
        /* filter: invert(0); */
        /* perspective: 0em; */

        ;
      }
    </style>
  </head>
  <body>
    <div class="parent">
      <div class="box box1"></div>
      <div class="box box2"></div>
      <div class="box box3"></div>
      <div class="box box4"></div>
    </div>
  </body>
</html>
