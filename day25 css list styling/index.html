<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css list styling</title>
    <style>
        nav ul li{
            
            list-style-type:"  "
            background-color: aqua;
            list-style-position: inside;/*it will include markers too in the background color*/
            border: 2px solid black;
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Contact</li>
            <p>in this list there is a dot marker and then list item name when we create navbar we need to remove it.so this marker is there beuause of its display property is list-item
                display:list-item;
            we can change it using list-style property.
            </p>
        </ul>
    </nav>
</body>
</html>
