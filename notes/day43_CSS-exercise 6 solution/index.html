<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS exercise-6 solution</title>
    <style>
        .logo{
            width: 40px;
            height: 23px;
            
        }
        nav{
            display: flex;
            justify-content: space-around;
            align-items: center;
            /* we use align item when we have one row */
            /* use align content in multiple rows */
        }
        .right ul{
            display: flex;
            gap: 34px;

        }

        .right ul li{
            list-style: none;
        }
        
        logo img{
            width: 164px;
        }

    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <img src="https://www.ultraedit.com/wp-content/uploads/2023/01/UE-logo.svg" alt="">
            </div>
            <div class="right">
                <ul>
                    <li>products</li>
                    <li>pricing</li>
                    <li>resources</li>
                    <li>about us</li>
                    <li><img src="https://www.ultraedit.com/wp-content/uploads/2023/01/Frame-349.svg" alt=""></li>
                </ul>
            </div>
        </nav>
    </header>
</body>
</html>
