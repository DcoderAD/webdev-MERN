<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            border: 2px solid rgb(175, 3, 3);
            padding: 34px;
            margin: 50px;
            box-shadow:3px 5px 5px #888888  ;

        }
        .outline{
            /* outline will always be out side of the border.you cant change the width of an outline */
            border: 2px solid red;
            /* when you change border radius outline radius follows.cant make outline curvy you can make border curvy and outline will simplyy follows it */
            border-radius: 34px;
             outline:4px solid black;
            outline-offset: 40px;
        }
    </style>
</head>
<body>
    <div class="box">
        i am a box
    </div>
    <p class="outline">
        Lorem ipsum dolor sit amet consectetur, adipisicing elit. Culpa voluptatum labore, sunt omnis, ipsa animi vitae iste suscipit odit ea sint laudantium nemo.
    </p>
</body>
</html>
