<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css grid-template-row/column</title>
    <style>
        .container{
           
            border: 2px solid rgb(29, 29, 1);
            /* in grid you can select number of rows and column */
            /* learn about grid line and grid area */
            /* learn about grid templet row and column */
            /* g-t-c will decide how many columns will be there in the grid */
            /* g-t-r will decide how many rows will be there in the grid */

            width: 80vw;
            height: 100vh;
            display: grid;
            grid-template-columns: 120px 100px;
            grid-template-rows: 100px 100px;
            /* gap: 34px; */
            /* dont use padding in flexbox or grid just use gap property */
            row-gap: 10px;
            column-gap: 20px;



            /* fr unit used to devided available width into same parts.for example below we are deviding 80vw into 3 same part using 1fr 1fr 1fr */
             width: 80vw;
             grid-template-columns: 1fr 1fr 1fr 1fr;


            /* item will align in their respective cells */
             justify-items: center;
             align-items: center;
        }
        .item
        {
            border: 2px solid red;
            height: 55px;
            width: 55px;
        }

        .item-4
        { 
            /* item 4 item 1 ke place pe aa jayega and item 1 row me aage push ho jayega */
            /* if you apply same properties to item 1 too them item 1 and 4 will overlap */
            /* 1/2 means start from 1 and go up to 2 */
            grid-row:1/2 ;
            grid-column:1/2; 
        }

        .item-1
        {
            grid-row: 1/2;

            /* /or */

            /* grid-row-start: 1;
            grid-row-end: 2; */


            grid-column: 1/2;

        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item item-1">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item item-4">4</div>
        <div class="item">5</div>
    </div>
</body>
</html>
